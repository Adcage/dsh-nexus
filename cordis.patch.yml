# dsh-nexus bundle patch: inserts this plugin's Loader row into a profile's
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) over dsh-base.
#
# The row id is the plugin's identity in the composed tree and the id targeted by
# user patches in `<profile>/cordis.patch.yml`. Renaming it breaks those
# overrides, so it is fixed: package name, row id and host `name` are all
# `dsh-nexus`. The browser half is loaded by the `dsh.client` declaration in
# package.json, not by a second row.
- insert:
    - id: dsh-nexus
      name: 'dsh-nexus'
